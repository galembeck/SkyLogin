name: ${project.name}
version: ${project.version}
main: ${plugin.main}
description: ${project.description}
author: SkyMinigames
load: STARTUP

commands:
  register:
    description: Create your account.
    usage: /register <senha> <senha>
    aliases: [registrar, reg]
  login:
    description: Log in to your account.
    usage: /login <senha>
    aliases: [logar, l]

permissions:
  skylogin.*:
    description: Gives access to every SkyLogin permission.
    default: op
    children:
      skylogin.admin: true
      skylogin.bypass: true
  skylogin.admin:
    description: Allows using /skylogin admin commands.
    default: op
  skylogin.bypass:
    description: Skips the per-IP account limit.
    default: false
