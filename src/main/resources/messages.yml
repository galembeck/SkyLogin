# ============================================================
#  SkyLogin - mensagens (cores com "&")
#  Placeholders: {player}, {seconds}, {attempts}, {min}, {max}, {name}, {registered}
#  Lines starting with <center> are centered in the chat.
# ============================================================

# Text added before every chat message (empty = no prefix)
prefix: ""

# Títulos na tela. Tempos em ticks (20 ticks = 1 segundo).
title:
  before-register:
    title: "&6&lSKY MINIGAMES"
    subtitle: "&f/register <senha> <senha>"
    fade-in: 10
    stay: 9999
    fade-out: 10
  before-login:
    title: "&6&lSKY MINIGAMES"
    subtitle: "&f/login <senha>"
    fade-in: 10
    stay: 9999
    fade-out: 10
  after-register:
    title: "&6&lSKY MINIGAMES"
    subtitle: "&fRegistrado! Redirecionando..."
    fade-in: 0
    stay: 40
    fade-out: 10
  after-login:
    title: "&6&lSKY MINIGAMES"
    subtitle: "&fAutenticado! Redirecionando..."
    fade-in: 0
    stay: 40
    fade-out: 10

# Placar lateral exibido até o jogador fazer login. Título até 32 caracteres, linhas até 40, no máximo 15 linhas.
scoreboard:
  title: "&6&lSKY MINIGAMES"
  register:
    - ""
    - " &fAutentique-se!"
    - " &7Use /login para"
    - " &7se autenticar."
    - ""
    - " &fRegistre-se!"
    - " &7Use /register para"
    - " &7se registrar."
    - ""
    - "&ewww.skyminigames.com"
  login:
    - ""
    - " &fAutentique-se!"
    - " &7Use /login para"
    - " &7se autenticar."
    - ""
    - " &fRegistre-se!"
    - " &7Use /register para"
    - " &7se registrar."
    - ""
    - "&ewww.skyminigames.com"

register:
  # Shown once, when a new player joins for the first time
  welcome:
    - ""
    - "  &6&lSKY MINIGAMES &8• &eÁrea de entrada"
    - "  &7Seja bem-vindo ao Sky Minigames!"
    - ""
    - "  &fUtilize &e/register <senha> <senha> &fpara registrar-se em nosso servidor."
    - ""
    - "&fDesejamos que tenha uma ótima experiência! &c❤"
    - ""
  # Repeated every few seconds until the player registers
  request: "&eRegistre-se utilizando &f/register <senha> <senha>&e."
  usage: "&cUtilize: &f/register <senha> <senha>"
  success: "&aConta registrada com sucesso!"
  already-registered: "&cVocê já está registrado. Use &f/login <senha>&c."
  passwords-mismatch: "&cAs senhas não são iguais."
  too-many-accounts: "&cVocê atingiu o limite de &f{max} &ccontas registradas neste IP."

login:
  # Shown when a registered player joins
  welcome:
    - ""
    - "  &6&lSKY MINIGAMES &8• &eÁrea de entrada"
    - "  &7Seja bem-vindo ao Sky Minigames!"
    - ""
    - "  &fUtilie &e/login <senha> &fpara autenticar-se em nosso servidor."
    - "  &fUtilize &e/mudarsenha <senha atual> <nova senha> &fpara alterar"
    - "  &fsua senha."
    - ""
    - "&fDesejamos que tenha uma ótima experiência! &c❤"
    - ""

  request: "&eAutentique-se utilizando &f/login <senha>&e."
  usage: "&cUtilize: &f/login <senha>"
  success: "&aAutenticado com sucesso! Redirecionando..."
  session-restored: "&aSessão restaurada. Bem-vindo de volta!"
  wrong-password: "&cSenha incorreta. Tentativas restantes: &f{attempts}"
  not-registered: "&cVocê ainda não está registrado. Use &f/register <senha> <senha>&c."
  already-logged: "&cVocê já está logado."

password:
  too-short: "&cA senha deve ter pelo menos &f{min} &ccaracteres."
  too-long: "&cA senha deve ter no máximo &f{max} &ccaracteres."
  too-weak: "&cEssa senha é muito fraca. Escolha outra."
  same-as-name: "&cA senha não pode ser igual ao seu nick."

kick:
  register-timeout: "&6&lSKY MINIGAMES\n\n&cVocê demorou muito para se registrar."
  login-timeout: "&6&lSKY MINIGAMES\n\n&cVocê demorou muito para fazer login."
  too-many-attempts: "&6&lSKY MINIGAMES\n\n&cVocê errou a senha muitas vezes."
  invalid-name: "&6&lSKY MINIGAMES\n\n&cSeu nick é inválido.\n&7Use apenas letras, números e _ (3 a 16 caracteres)."
  name-case-mismatch: "&6&lSKY MINIGAMES\n\n&cO nick &f{name} &cjá está registrado como &f{registered}&c.\n&7Entre usando exatamente &f{registered}&7."
  already-online: "&6&lSKY MINIGAMES\n\n&cJá existe um jogador conectado com este nick."
  antibot-verify: "&6&lSKY MINIGAMES\n\n&eVerificação anti-bot\n&7Aguarde &f{seconds} segundos &7e reconecte ao servidor."
  database-error: "&6&lSKY MINIGAMES\n\n&cNão foi possível carregar sua conta.\n&7Tente novamente em alguns instantes."

general:
  processing: "&7Aguarde, processando..."
  database-error: "&cOcorreu um erro ao acessar o banco de dados. Tente novamente."
  player-only: "&cApenas jogadores podem usar este comando."
